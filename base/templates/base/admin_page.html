<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <div class="container">
        <div class="row align-items-center mt-5" style="height: 80vh;">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <div class="card bg-light p-3">
                    <div class="card-body">
                        <h2 class="text-center">Admin Dashboard</h2>
                        <div class="row mb-3 mt-3">
                            <div class="col d-grid">
                                <a href="{% url 'item-panel' %}" class="btn btn-lg btn-primary btn-block">Items</a>
                            </div>
                            <div class="col d-grid">
                                <a href="{% url 'client-panel' %}" class="btn btn-lg btn-primary btn-block">Clients</a>
                            </div>
                        </div>
                        <div class="row mb-3 mt-3">
                            <div class="col d-grid">
                                <a href="{% url 'block-date' %}" class="btn btn-lg btn-primary btn-block">Block Out Date</a>
                            </div>
                            <div class="col d-grid">
                                <a href="{% url 'block-time' %}" class="btn btn-lg btn-primary btn-block">Block Out Time</a>
                            </div>
                        </div>
                        <div class="row mb-3 mt-3">
                            <div class="col d-grid">
                                <a href="{% url 'finals-week' %}" class="btn btn-lg btn-primary btn-block">Finals Week</a>
                            </div>
                            <div class="col d-grid">
                                <a href="{% url 'block-gradwaiting'%}" class="btn btn-lg btn-primary btn-block">Block Seniors</a>
                            </div>
                        </div>
                        
                        <div class="row mb-5 mt-5">
                            <div class="col d-grid">
                                <a href="{% url 'logout' %}" class="btn btn-lg btn-primary btn-block">Logout</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3"></div>
        </div>
</body>
</html>
