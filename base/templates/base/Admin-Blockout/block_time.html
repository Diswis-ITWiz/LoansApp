<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <table>
            <tr>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>Description</th>
            </tr>
            {% for time in blockedTimes %}
            <tr>
                <td>{{time.dateBlocked}}</td>
                <td>{{time.timeStart|time:"H:i:s"}}</td>
                <td>{{time.timeEnd|time:"H:i:s"}}</td>
                <td>{{time.description}}</td>
            </tr>
            {% endfor %}
        </table>
       
    </div>
    <hr>
    <form method="POST">
        {% csrf_token %}
        <input type="date" name="dateInput" required>
        <input type="time" name="startTime" min="09:30" max="17:00" required>
        <input type="time" name="endTime" min="09:30" max="17:00" required>
        <input type="text" name="descriptionInput">
        <button type="submit">Block</button>
    </form>
    <a href="{% url 'admin-dashboard' %}">Cancel</a>
</body>
</html>
