<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Item - Select Item</title>
</head>
<body>
    {% if items %}
    <div>
        <form method="GET" action="{% url 'loan-item-transaction' client.clientId%}">
            <div>
                <label for="itemSelector">Item Category Number:</label>
                <select name="selectedItem" id="itemSelector">
                    <option disabled
                    {% if selectedItem is not True%}
                    selected
                    {% endif%} value="">Select Item ID</option>
                    {% for item in items %}

                    {%if selectedItem%}
                        <option value="{{item.itemCat}}" 
                        {% if selectedItem == item.itemCat %} 
                        selected 
                        {% endif %}>
                            {{item.itemCat}}
                        </option>
                    {% else %}
                        <option value="{{item.itemCat}}">{{item.itemCat}}</option>
                    {% endif%}

                    {% endfor %}
                </select>
            </div>
            <button type="submit" value="submit">Calculate</button>
        </form>
        
    </div>
    {% endif %}
    <form method="POST" action="">
        {% csrf_token %}
        <form class="form" action="" method="POST">
            <p>Item Type: {{itemType}}</p>
            <table>
                {{form.as_table}}
            </table>
    
        <input type="submit" value="Submit">
        </form>
    </form>
    <hr>

    <a href="{% url 'loan-item' %}">Cancel</a>
</body>
</html>
