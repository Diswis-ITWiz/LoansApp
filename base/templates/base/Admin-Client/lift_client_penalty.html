<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifting Client Penalties</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="text-center mb-3">Lift Client Penalty</h1>
                        <p class="text-center">Are you sure you want to lift the penalties of <br>
                            {{client.clientId}} - {{client.lastName}}, {{client.firstName}}</p>
                        <form method="POST" action="">
                            {% csrf_token %}
                            <div class="row mb-3 mt-3">
                                <div class="col">
                                    

                                        <div class="form-floating mb-3 mt-3">
                                            <select name="liftType" id="reportType" class="form-select">
                                                <option value="All">Blacklist -- Lift ALL penalties</option>
                                                <option value="BL">Blacklist -- Lift penalties except Blacklist</option>
                                                <option value="TBL">Temporary Blacklist -- Lift penalties</option>
                                                <option value="RF">Fine -- Reduce Fine to 0</option>
                                                <option value="W">Warning -- Reduce Warning Count</option>
                                            </select>
                                            <label for="reportType">Select Lifting Penalty Option:</label>
                                        </div>
                                </div>
                                
                            </div>
                            <div class="row mb-3 mt-5">
                                <div class="col">
                                    <div class="d-flex justify-content-between">
                                        <button onclick="history.back()" class="btn btn-secondary">Cancel</button>
                                        <input type="submit" value="Confirm" class="btn btn-primary ms-3">
                                    </div>
                                </div>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
            <div class="col-md-3"></div>
        </div>
    </div>
    
</body>
</html>
