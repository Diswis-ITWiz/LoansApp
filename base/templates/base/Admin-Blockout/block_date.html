<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <table>
            <tr>
                <th>Date</th>
                <th>Description</th>
            </tr>
            {% for date in blockedDates%}
            <tr>
                <td>{{date.dateBlocked}}</td>
                <td>{{date.description}}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <hr>
    <form method="POST">
        {% csrf_token %}
        <form method="POST">
            <table>
                {{form.as_table}}
            </table>
            
            <button type="submit">Submit</button>
        </form>
    </form>
    <a href="{% url 'admin-dashboard' %}">Cancel</a>
</body>
</html>
