<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Client</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <div class="container">
        <div class="row align-items-center" style="height: 80vh">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <div class="card bg-light p-3">
                    <div class="card-body">

                        <h2 class="text-center">Register Client</h2>
                        <br>
                        <form class="form" action="" method="POST">
                            {%csrf_token%}
                            <div class="row pt-1">
                                <div class="col-sm-3">

                                </div>
                                <div class="col">

                                </div>
                            </div>
                            <table>
                                {{form.as_table}}
                            </table>
                            <div class="row pt-2">
                                <div class="col-sm-3"><input type="submit" class="btn btn-primary" value="Submit"></div>
                                <div class="col-sm-3"><a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a></div>
                            </div>                           
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-3"></div>
            
        </div>
    </div>
</body>
</html>
