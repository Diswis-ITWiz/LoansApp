<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST" action="">
        {% csrf_token %}
        <div>
            <p>Are you sure you want to lift "{{item}}" penalties?</p>
            <p>If Client has a BlackList, all penalties are removed except for the blacklist itself</p>
        </div>

        <div>
            <input type="submit" value="Confirm" />
        </div>
    </form>
    <button onclick="history.back()">Cancel</button>
</body>
</html>
